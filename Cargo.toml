[package]
name = "Ultimate"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
glam = "0.33.2"
gltf = "1.4.1"
image = "0.25.10"

egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"

wgpu = "30.0.0"
winit = "0.30.13"

log = "0.4.33"
pollster = "1.0.1"
quinn = "0.11.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stunclient = "0.4.2"
tokio = { version = "1.53.1", features = ["fs", "full", "macros", "rt", "time"] }
toml = "1.1.3"
egui_extras = "0.36.2"
x25519-dalek = "3.0.0"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
rand_core = "0.10.1"
